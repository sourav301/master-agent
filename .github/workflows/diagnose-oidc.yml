name: Diagnose OIDC Token

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and Decode OIDC Token
        run: |
          echo "=== RAW JWT ==="
          echo "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" | cut -d. -f2 | base64 -d 2>/dev/null | jq . || true
          echo ""
          echo "=== ENV API URL ==="
          echo "URL=$ACTIONS_ID_TOKEN_REQUEST_URL"
          curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | jq -r '.value' | cut -d. -f2 | base64 -d 2>/dev/null | jq '{
              sub,
              aud,
              iss,
              repository: .repository,
              environment
            }' || echo "CURL_FAILED"